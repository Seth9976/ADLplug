name: Build Windows VST2 and VST3  
  
on:  
  workflow_dispatch:  
  push:  
    branches:  
      - master  
      - main  
  pull_request:  
  
jobs:  
  build-windows:  
    name: ${{ matrix.plugin }} Windows x64  
    runs-on: windows-2019  
  
    strategy:  
      fail-fast: false  
      matrix:  
        include:  
          - chip: OPL3  
            plugin: ADLplug  
          - chip: OPN2  
            plugin: OPNplug  
  
    steps:  
      - name: checkout-code  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: extract-vst2-sdk  
        if: ${{ hashFiles('vstsdk2.4.zip') != '' }}  
        run: Expand-Archive -Path "vstsdk2.4.zip" -DestinationPath "thirdparty/vstsdk2.4" -Force  
  
      - name: configure-project  
        run: cmake -G "Visual Studio 16 2019" -A x64 -T host=x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DADLplug_CHIP=${{ matrix.chip }} -DADLplug_VST2=ON -DADLplug_VST3=ON -DADLplug_LV2=OFF -DADLplug_AU=OFF -DADLplug_Standalone=OFF -DADLplug_Jack=OFF -DADLplug_PCH=OFF -S . -B build  
  
      - name: build-vst2  
        run: cmake --build build --config Release --target ADLplug_VST2 --parallel  
  
      - name: build-vst3  
        run: cmake --build build --config Release --target ADLplug_VST3 --parallel  
  
      - name: inspect-binary-tree  
        run: Get-ChildItem -Path "build" -Recurse -Force  
  
      - name: create-vst2-dist-dir  
        run: New-Item -ItemType Directory -Force -Path "dist\vst2"  
  
      - name: create-vst3-dist-dir  
        run: New-Item -ItemType Directory -Force -Path "dist\vst3\${{ matrix.plugin }}.vst3\Contents\x86_64-win"  
  
      - name: create-vst3-resources-dir  
        run: New-Item -ItemType Directory -Force -Path "dist\vst3\${{ matrix.plugin }}.vst3\Contents\Resources"  
  
      - name: copy-detected-vst2  
        run: Copy-Item -Path (Get-ChildItem -Path "build\vst2" -Recurse -File -Filter "*.dll").FullName -Destination "dist\vst2\${{ matrix.plugin }}.dll" -Force  
  
      - name: copy-detected-vst3  
        run: Copy-Item -Path (Get-ChildItem -Path "build\vst3" -Recurse -File -Filter "*.dll").FullName -Destination "dist\vst3\${{ matrix.plugin }}.vst3\Contents\x86_64-win\${{ matrix.plugin }}.vst3" -Force  
  
      - name: inspect-dist-tree  
        run: Get-ChildItem -Path "dist" -Recurse -Force  
  
      - name: upload-artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: ${{ matrix.plugin }}-windows-x64-vst2-vst3  
          path: dist  
          if-no-files-found: error
