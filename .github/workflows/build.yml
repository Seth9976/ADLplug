name: Build Windows VST2 and VST3  
  
on:  
  workflow_dispatch:  
  push:  
    branches:  
      - master  
      - main  
  pull_request:  
  
jobs:  
  build_windows_vst:  
    name: ${{ matrix.plugin }} Windows x64  
    runs-on: windows-2019  
  
    strategy:  
      fail-fast: false  
      matrix:  
        include:  
          - chip: OPL3  
            plugin: ADLplug  
          - chip: OPN2  
            plugin: OPNplug  
  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: Configure git line endings  
        shell: bash  
        run: git config --global core.autocrlf input  
  
      - name: Extract optional VST2 SDK  
        shell: pwsh  
        run: if (Test-Path "vstsdk2.4.zip") { Expand-Archive -Path "vstsdk2.4.zip" -DestinationPath "thirdparty/vstsdk2.4" -Force }  
  
      - name: Verify VST2 SDK  
        shell: pwsh  
        run: if (Test-Path "thirdparty/vstsdk2.4") { Get-ChildItem -Path "thirdparty/vstsdk2.4" -Recurse -Force }  
  
      - name: Setup MSVC Developer Environment  
        uses: ilammy/msvc-dev-cmd@v1  
        with:  
          arch: x64  
  
      - name: Setup Ninja  
        uses: seanmiddleditch/gha-setup-ninja@v5  
  
      - name: Configure CMake  
        shell: cmd  
        run: cmake -S . -B build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DADLplug_CHIP=${{ matrix.chip }} -DADLplug_VST2=ON -DADLplug_VST3=ON -DADLplug_LV2=OFF -DADLplug_AU=OFF -DADLplug_Standalone=OFF -DADLplug_Jack=OFF -DADLplug_PCH=OFF  
  
      - name: Build VST2 and VST3  
        shell: cmd  
        run: cmake --build build --config Release --target ADLplug_VST2 ADLplug_VST3 --parallel  
  
      - name: Inspect generated binary tree  
        shell: pwsh  
        run: Get-ChildItem -Path "build" -Recurse -Force  
  
      - name: Create VST2 artifact directory  
        shell: pwsh  
        run: New-Item -ItemType Directory -Path "artifact\vst2" -Force  
  
      - name: Create VST3 artifact directory  
        shell: pwsh  
        run: New-Item -ItemType Directory -Path "artifact\vst3\${{ matrix.plugin }}.vst3\Contents\x86_64-win" -Force  
  
      - name: Create VST3 resources directory  
        shell: pwsh  
        run: New-Item -ItemType Directory -Path "artifact\vst3\${{ matrix.plugin }}.vst3\Contents\Resources" -Force  
  
      - name: Copy detected VST2 binary  
        shell: pwsh  
        run: Copy-Item -Path ([Linq.Enumerable]::First(([IO.Directory]::EnumerateFiles("$PWD\build", "*.dll", "AllDirectories")).Where({ $_ -like "*\vst2\*" }))) -Destination "artifact\vst2\${{ matrix.plugin }}.dll" -Force  
  
      - name: Copy detected VST3 binary  
        shell: pwsh  
        run: Copy-Item -Path ([Linq.Enumerable]::First(([IO.Directory]::EnumerateFiles("$PWD\build", "*.dll", "AllDirectories")).Where({ $_ -like "*\vst3\*" }))) -Destination "artifact\vst3\${{ matrix.plugin }}.vst3\Contents\x86_64-win\${{ matrix.plugin }}.vst3" -Force  
  
      - name: Inspect packaged plugin tree  
        shell: pwsh  
        run: Get-ChildItem -Path "artifact" -Recurse -Force  
  
      - name: Upload Windows plugins  
        uses: actions/upload-artifact@v4  
        with:  
          name: ${{ matrix.plugin }}-windows-x64-vst2-vst3  
          path: artifact  
          if-no-files-found: error
